<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Motor Driver Controller — 四路直流电机驱动器</title>
<script>
/* 主题预置: URL 参数 ?theme= > 本地选择 > 系统偏好 > 默认深色 (在 head 内执行避免闪色) */
(function(){try{
  var p=new URLSearchParams(location.search).get('theme');
  var t=(p==='light'||p==='dark')?p:(localStorage.getItem('mdc-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
  document.documentElement.dataset.theme=t;
}catch(e){}})();
</script>
<style>
:root,html[data-theme="dark"]{
  --bg:#0a0e18;--panel:#111827;--panel2:#0d1321;--text:#c5c9d4;--border:#1f2937;
  --accent:#4b8ce8;--accent2:#5ea0f5;--green:#3a9a56;--green2:#47b06a;--red:#d94444;
  --muted:#8b93a3;--gold:#e8b84b;--purple:#a78bfa;--glow:rgba(75,140,232,.14);
  --hair:color-mix(in srgb,var(--border) 72%,transparent);
}
html[data-theme="light"]{
  --bg:#f4f6fa;--panel:#ffffff;--panel2:#eef1f6;--text:#2a3140;--border:#d9dfe8;
  --accent:#2563eb;--accent2:#3b82f6;--green:#16a34a;--green2:#22c55e;--red:#dc2626;
  --muted:#64748b;--gold:#b45309;--purple:#7c3aed;--glow:rgba(37,99,235,.08);
  --hair:color-mix(in srgb,var(--border) 72%,transparent);
}
*{margin:0;padding:0;box-sizing:border-box}button,input,select,textarea{font:inherit}
body{font:15px/1.7 'MiSans','HarmonyOS Sans SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Segoe UI','Microsoft YaHei UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 56px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--panel2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-size:13px}

/* ---- 扁平 SVG 图标 ---- */
.ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.fill{fill:currentColor;stroke:none}

/* ---- 主题切换 ---- */
.theme-btn{position:fixed;top:16px;right:16px;z-index:100;width:38px;height:38px;border-radius:10px;
  border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.2s}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn .ic{width:18px;height:18px}

/* ---- hero ---- */
.hero{text-align:center;padding:52px 0 10px;margin-bottom:44px;
  background:radial-gradient(ellipse 80% 60% at 50% -10%,var(--glow),transparent)}
.hero .logo{display:inline-flex;align-items:center;gap:12px;color:#fff;justify-content:center}
html[data-theme="light"] .hero .logo{color:var(--text)}
.hero h1{font-size:32px;letter-spacing:1px;display:inline}
.hero .logo .ic{width:30px;height:30px;color:var(--gold)}
.hero .tag{display:inline-block;margin-top:12px;padding:3px 14px;border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:13px}
.hero .sub{color:var(--muted);margin-top:10px;font-size:14px}
.hero .cta{margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---- 按钮 ---- */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;padding:9px 20px;border-radius:8px;
  font-size:14px;font-weight:600;text-decoration:none;border:none;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent2);text-decoration:none;transform:translateY(-1px)}
.btn.green{background:var(--green)}.btn.green:hover{background:var(--green2)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:500}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent;transform:none}
.btn.sm{padding:5px 12px;font-size:12.5px;border-radius:6px;font-weight:500}
.btn.plain{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
.btn.plain:hover{border-color:var(--accent);color:var(--accent);background:transparent;transform:none}

/* ---- 区块标题行: 标题+版本+日期+动作 同行, 底部对齐 ---- */
section{margin-bottom:40px}
section + section{border-top:1px solid var(--border);padding-top:40px}
h2{font-size:26px;color:var(--text);margin-bottom:16px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h2 .ic{width:24px;height:24px;transform:translateY(2px)}
h2 .chip{align-self:center}
h2 .hi-acc{color:var(--accent)}
h2 .hi-gold{color:var(--gold)}
h2 .v{font-family:'Cascadia Code','Consolas','Courier New',monospace;font-size:24px;font-weight:700;color:var(--text)}
h2 .date{font-size:13px;color:var(--muted);font-family:'Cascadia Code','Consolas','Courier New',monospace}
h2 .extras{margin-left:auto;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hint{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.8}
.hint b{color:var(--text);font-weight:600}

/* ---- 徽标 ---- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 10px;border-radius:12px;font-size:12.5px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.chip.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.chip.grn{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.chip.gld{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}

/* ---- 当前版行 ---- */

/* ---- 统一扁平列表 (文件 / 资料 / 历史版本 同一套视觉) ---- */
.lb{margin-top:18px}
.lht{font-size:12.5px;font-weight:600;letter-spacing:.5px;color:var(--text)}
.lhead,.lr{display:grid;gap:12px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--hair)}
.lhead{font-size:12px;color:var(--muted);padding:4px 2px;letter-spacing:.3px}
.lr{transition:background .15s}
.lr:hover{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.lr:last-child{border-bottom:none}
.lg-files{grid-template-columns:minmax(auto,1.15fr) minmax(0,1.6fr) 92px 40px}
.lg-res{grid-template-columns:minmax(auto,1fr) minmax(0,1.9fr) 40px}
.lg-hist{grid-template-columns:120px 100px 1fr}
.fticon{width:15px;height:15px;flex-shrink:0;color:var(--accent)}
/* 马卡龙色系·加深档 (bin天空蓝/hex抹茶绿/pdf草莓粉/md香芋紫/html马卡龙青/文件夹奶黄) */
.c-bin{color:#6FA9E2}
.c-hex{color:#6FC98A}
.c-pdf{color:#F08CA2}
.c-md{color:#A98BD6}
.c-html{color:#5FC4C4}
.c-dir{color:#E8C964}
.fn{font-family:'Cascadia Code','Consolas','Courier New',monospace;font-size:13.5px;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:6px}
.fn a{display:flex;align-items:center;gap:6px}
.fn a{color:var(--text)}
.fn a:hover{color:var(--accent);text-decoration:none}
.fnote{font-size:12.5px;color:var(--muted)}
.fdate{font-size:12.5px;color:var(--muted);font-family:'Cascadia Code','Consolas','Courier New',monospace;white-space:nowrap}
.c-op{text-align:right}
.hv{font-family:'Cascadia Code','Consolas','Courier New',monospace;font-weight:700;font-size:14px;color:var(--accent);display:flex;gap:8px;align-items:center;white-space:nowrap}
.hv.old{color:var(--muted)}
.hdate{font-size:13px;color:var(--muted);font-family:'Cascadia Code','Consolas','Courier New',monospace;white-space:nowrap}
.ops{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ibtn{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;border-radius:6px;font-size:12px;
  color:var(--muted);text-decoration:none;flex-shrink:0;transition:.15s}
.ibtn .ic{width:13px;height:13px}
.ibtn .lb2{font-size:11.5px;font-family:'Cascadia Code','Consolas','Courier New',monospace}
.ibtn:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);text-decoration:none}
.ibtn.det{color:var(--text)}
.ibtn.det:hover{color:var(--accent)}
/* 同一行多个操作按钮之间: 浅灰竖线分隔 — 独立伪元素悬浮在两钮正中(左右各 6px),
 * 不再作为按钮 border 贴在盒子上, 悬停高亮底色不会顶到分隔线 */
.ops .ibtn + .ibtn{position:relative;margin-left:4px}
.ops .ibtn + .ibtn::before{content:'';position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:1px;height:14px;background:var(--hair)}

.hint{margin-top:16px}

/* ---- 杂项 ---- */
.status{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding-top:16px}
@media(max-width:640px){
  .hero h1{font-size:24px}
  h2{font-size:22px}
  h2 .ic{width:20px;height:20px}
  .lg-files,.lg-res{display:flex;flex-wrap:wrap}
  .fnote{flex:1;min-width:150px}
  .fdate{margin-left:auto}
  .c-op{margin-left:0;width:100%;text-align:left}
  .lhead{display:none}
  h2 .extras{margin-left:0}
  .lg-hist{grid-template-columns:80px 1fr;grid-auto-rows:auto}
  .lg-hist .ops{grid-column:1/-1;justify-content:flex-start}
}
</style>
</head>

<script>
(function(){
  'use strict';
  /* ====== 主题切换 ====== */
  var tbtn=document.getElementById('theme-btn');
  function renderThemeBtn(){
    var dark=document.documentElement.dataset.theme!=='light';
    tbtn.querySelector('use').setAttribute('href',dark?'#i-sun':'#i-moon');
    tbtn.title=dark?'切换到浅色':'切换到深色';
  }
  tbtn.onclick=function(){
    var next=document.documentElement.dataset.theme==='light'?'dark':'light';
    document.documentElement.dataset.theme=next;
    try{localStorage.setItem('mdc-theme',next);}catch(e){}
    renderThemeBtn();
  };
  renderThemeBtn();

  /* ====== 工具 ====== */
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function ic(n,cls){return '<svg class="ic '+(cls||'')+'"><use href="#i-'+n+'"/></svg>'}
  function dateOrDash(d){return d?esc(d):'—'}
  function baseName(href){
    try{return decodeURIComponent(String(href).split('/').pop());}catch(e){return String(href).split('/').pop();}
  }
  /* 文件类型图标: 实心纸页+镂空字母 (B/H/P/M, 色类区分); GitHub 树链接(多文件资料)用实心黄文件夹 */
  function ftIcon(href){
    var h=String(href||'').toLowerCase();
    if(/github\.com\/[^/]+\/[^/]+\/tree\//.test(h))return ic('folder','fticon c-dir');
    if(/\.html?$/.test(h))return ic('f-html','fticon c-html');
    if(/\.bin$/.test(h))return ic('f-bin','fticon c-bin');
    if(/\.hex$/.test(h))return ic('f-hex','fticon c-hex');
    if(/\.pdf$/.test(h))return ic('f-pdf','fticon c-pdf');
    if(/\.md$/.test(h))return ic('f-md','fticon c-md');
    if(/\.zip$/.test(h))return ic('f-zip','fticon');
    return ic('file','fticon');
  }
  /* 统一列表块: 标题并入表头首格(同一行), label 为空则保留默认首列头 */
  function lb(label,labelExtra,headCols,rows){
    var body=Array.isArray(rows)?rows.join(''):rows;
    var cells=headCols.c.slice();
    if(label)cells[0]='<span class="lht">'+esc(label)+(labelExtra||'')+'</span>';
    return '<div class="lb"><div class="lhead '+headCols.g+'">'+cells.join('')+'</div>'+body+'</div>';
  }
  var HEAD_FILES={g:'lg-files',c:['<span class="lht">文件</span>','<span>说明</span>','<span>发布时间</span>','<span class="c-op">操作</span>']};
  var HEAD_RES={g:'lg-res',c:['<span>文件</span>','<span>说明</span>','<span class="c-op">操作</span>']};
  var HEAD_HIST={g:'lg-hist',c:['<span>版本</span>','<span>日期</span>','<span style="text-align:right">操作</span>']};
  /* 文件行: 文件名(含类型图标) 说明 发布时间 [下载] */
  function frow(href,note,date){
    if(!href)return '';
    var nm=baseName(href);
    return '<div class="lr lg-files">'+
      '<span class="fn"><a href="'+esc(href)+'" download title="下载 '+esc(nm)+'">'+ftIcon(href)+esc(nm)+'</a></span>'+
      '<span class="fnote">'+(note?esc(note):'')+'</span>'+
      '<span class="fdate">'+dateOrDash(date)+'</span>'+
      '<span class="c-op"><a class="ibtn" href="'+esc(href)+'" download title="下载 '+esc(nm)+'">'+ic('download')+'</a></span>'+
      '</div>';
  }
  /* 资料行 (无日期列): 名称用 json 的 name (有拓展名的显示拓展名); 外链(GitHub)用跳转按钮新开标签, 站内文件用下载按钮 */
  function rrow(r){
    var ext=!!(r.href&&/^https?:/i.test(r.href));
    return '<div class="lr lg-res">'+
      '<span class="fn">'+(r.href?'<a href="'+esc(r.href)+'"'+(ext?' target="_blank" rel="noopener"':'')+' title="'+esc((ext?'前往 ':'打开 ')+r.name)+'">'+ftIcon(r.href)+esc(r.name)+'</a>':ftIcon('')+esc(r.name))+'</span>'+
      '<span class="fnote">'+(r.note?esc(r.note):'')+'</span>'+
      '<span class="c-op">'+(r.href?(ext?'<a class="ibtn" href="'+esc(r.href)+'" target="_blank" rel="noopener" title="前往 '+esc(r.name)+'（GitHub）">'+ic('ext')+'</a>'
                                      :'<a class="ibtn" href="'+esc(r.href)+'" download title="下载 '+esc(r.name)+'">'+ic('download')+'</a>'):'')+'</span>'+
      '</div>';
  }
  /* 历史行操作按钮: 下载图标 + 微标签 */
  function ibtn(href,label,title){
    if(!href)return '';
    return '<a class="ibtn" href="'+esc(href)+'" download title="'+esc(title||('下载 '+label))+'">'+ic('download')+'<span class="lb2">'+esc(label)+'</span></a>';
  }
  function chipTxt(txt,cls){return '<span class="chip '+(cls||'')+'">'+esc(txt)+'</span>'}

  /* ====== 历史行构造 (withCur: 最新行加徽标; old: 存档行弱化) ====== */
  function hostRows(hrs,withCur,old){
    var rows=[];
    for(var i=hrs.length-1;i>=0;i--){
      var h=hrs[i];
      rows.push({v:'v'+h.ver,d:h.date,cur:withCur&&i===hrs.length-1,old:old,title:h.notes,
        ops:(h.detail?'<a class="ibtn det" href="'+esc(h.detail)+'" title="查看发布详情">详细</a>':'')+
            ibtn(h.offline,'离线','下载离线版')+ibtn(h.online,'联网','下载联网版')});
    }
    return rows;
  }
  function fwRows(rels,withCur,old){
    var rows=[];
    for(var i=rels.length-1;i>=0;i--){
      var r=rels[i];
      rows.push({v:'v'+r.fw,d:r.date,cur:withCur&&i===rels.length-1,old:old,title:r.notes,
        ops:(r.detail?'<a class="ibtn det" href="'+esc(r.detail)+'" title="查看发布详情">详细</a>':'')+
            ibtn(r.fw_bin,'BIN','下载固件 BIN')+ibtn(r.fw_hex,'HEX','下载固件 HEX')});
    }
    return rows;
  }
  function histTable(rows){
    /* 列头由 lb() 统一输出, 这里只输出数据行, 否则表头重复 */
    var out='';
    rows.forEach(function(r){
      out+='<div class="lr lg-hist"><span class="hv'+(r.old?' old':'')+'"'+(r.title?' title="'+esc(r.title)+'"':'')+'>'+esc(r.v)+
        (r.cur?'<span class="chip grn">最新</span>':'')+'</span>'+
        '<span class="hdate">'+dateOrDash(r.d)+'</span>'+
        '<span class="ops">'+r.ops+'</span></div>';
    });
    return out;
  }

  /* ====== 上位机区块 (当前版 + 存档线并入历史) ====== */
  function hostSection(line,arch){
    var hrs=line.host_releases||[];
    var cur=hrs.length?hrs[hrs.length-1]:null;
    var out='<section><h2>'+ic('monitor','hi-acc')+'上位机';
    if(cur){
      out+='<span class="v">v'+esc(cur.ver)+'</span><span class="date">'+dateOrDash(cur.date)+'</span>'+
        '<span class="extras">'+
          (cur.web?'<a class="btn sm plain" href="'+esc(cur.web)+'">'+ic('monitor')+'在线使用</a>':'')+
        '</span>';
    }
    out+='</h2>';
    if(!cur){out+='<div class="status">暂无发布</div></section>';return out;}
    out+=lb(null,null,HEAD_FILES,[
      frow(cur.offline,'离线版，无检查更新与固件在线下载功能',cur.date),
      frow(cur.online,'联网版，含在线固件库 / 检查更新，断网自动降级',cur.date)
    ]);
    var rows=hostRows(hrs,true);
    arch.forEach(function(l){rows=rows.concat(hostRows(l.host_releases||[],false,true));});
    out+=lb('历史版本',null,HEAD_HIST,histTable(rows));
    return out+'</section>';
  }

  /* ====== 固件区块 (相关资料仅当前线; 存档线资料只经各版本详情页呈现) ====== */
  function fwSection(line,arch){
    var rels=line.releases||[];
    var cur=rels.length?rels[rels.length-1]:null;
    var h=cur?cur.host||{}:{};
    var out='<section><h2>'+ic('bolt','hi-acc')+'固件';
    if(cur){
      out+='<span class="v">v'+esc(cur.fw)+'</span><span class="date">'+dateOrDash(cur.date)+'</span>'+
        '<span class="extras">'+(h.ver?chipTxt('配套上位机 v'+h.ver):'')+'</span>';
    }
    out+='</h2>';
    if(!cur){out+='<div class="status">暂无发布</div></section>';return out;}
    out+=lb(null,null,HEAD_FILES,[
      frow(cur.fw_bin,'固件二进制（上位机刷写用）',cur.date),
      frow(cur.fw_hex,'HEX 格式（烧录器直刷）',cur.date)
    ]);
    var rs=(line.resources||[]).slice();
    if(rs.length){
      out+=lb('相关资料',null,HEAD_RES,rs.map(rrow));
    }
    var rows=fwRows(rels,true);
    arch.forEach(function(l){rows=rows.concat(fwRows(l.releases||[],false,true));});
    out+=lb('历史版本',null,HEAD_HIST,histTable(rows));
    return out+'</section>';
  }

  /* ====== Bootloader 区块 ====== */
  function blSection(bl){
    if(!bl||!bl.ver)return '';
    var out='<section><h2>'+ic('chip','hi-gold')+'Bootloader'+
      '<span class="v">v'+esc(bl.ver)+'</span>'+
      '<span class="chip gld">固件升级引导</span></h2>';
    out+=lb(null,null,HEAD_FILES,[frow(bl.file,'仅产线首次烧录（经 ST-LINK 写入）；日常固件升级在上位机内完成',null)]);
    var rows=[{v:'v'+bl.ver,d:null,cur:true,ops:ibtn(bl.file,'BIN','下载 Bootloader BIN')}];
    var his=bl.history||[];
    for(var i=his.length-1;i>=0;i--){
      var b=his[i];
      rows.push({v:'v'+b.ver,d:b.date,ops:ibtn(b.file,'BIN','下载 Bootloader BIN')});
    }
    out+=lb('历史版本',null,HEAD_HIST,histTable(rows));
    return out+'</section>';
  }

  /* ====== 渲染 ====== */
  fetch('releases.json',{cache:'no-cache'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(m){
    var app=document.getElementById('app');
    var lines=(m.lines||[]).slice().sort(function(a,b){return (b.current?1:0)-(a.current?1:0)});
    var cur=lines.filter(function(l){return l.current});
    var arch=lines.filter(function(l){return !l.current});
    if(!cur.length&&lines.length){cur=[lines[0]];arch=lines.slice(1);}
    var line=cur[0];
    var html='';
    if(line){
      html+=hostSection(line,arch);
      html+=fwSection(line,arch);
    }
    html+=blSection(m.bootloader);
    app.innerHTML=html||'<div class="status">暂无版本信息</div>';
    if(m.updated){var ft=document.getElementById('ft-upd');if(ft)ft.textContent='版本清单更新于 '+m.updated;}
  }).catch(function(e){
    document.getElementById('app').innerHTML=
      '<div class="status">版本清单加载失败（'+esc(e.message)+'）— 常用入口：<a href="web/v2/">在线上位机</a> · '+
      '<a href="release/motor_driver_ctrl-v1.2.0.bin" download>固件 v1.2.0</a></div>';
  });
})();
</script>
</body>
</html>
